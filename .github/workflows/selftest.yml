name: Pruebas del repositorio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Enlaces del repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
      - name: Comprobar enlaces
        uses: ./actions/check-links
        with:
          skip: tests/fixtures

  fixtures:
    name: Fixtures de la comprobación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: El contrato de sast y scan se mantiene
        run: python3 tests/test_actions.py

      - name: Las anclas reales pasan
        run: python3 actions/check-links/check_links.py tests/fixtures/ok

      - name: Un ancla inexistente falla
        run: |
          set +e
          python3 actions/check-links/check_links.py tests/fixtures/broken
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "Se esperaba el código 1 y llegó $code"
            exit 1
          fi

  sshd-baseline:
    name: Baseline de sshd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Las imágenes cerradas pasan
        uses: ./actions/check-sshd-baseline
        with:
          root: tests/fixtures/sshd
          skip: broken,broken-usepam,broken-apk-options

      - name: Las imágenes abiertas fallan
        run: |
          for case in broken broken-usepam broken-apk-options; do
            set +e
            python3 actions/check-sshd-baseline/check_sshd_baseline.py "tests/fixtures/sshd/$case"
            code=$?
            set -e
            if [[ "$code" -ne 1 ]]; then
              echo "Se esperaba el código 1 en $case y llegó $code"
              exit 1
            fi
          done

  browser-e2e:
    name: Prueba de interfaz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: El servicio que responde pasa
        uses: ./actions/browser-e2e
        with:
          working-directory: tests/fixtures/e2e
          start-script: tests/fixtures/e2e/start.sh
          wait-urls: http://127.0.0.1:8099/
          install-browser: "false"

      - name: Una URL que no responde falla
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          START_SCRIPT: tests/fixtures/e2e/start.sh
          WAIT_URLS: http://127.0.0.1:8098/
          WORKING_DIRECTORY: tests/fixtures/e2e
          TEST_COMMAND: node check.mjs
          TIMEOUT_SECONDS: "5"
        run: |
          set +e
          output="$(bash actions/browser-e2e/browser_e2e.sh 2>&1)"
          code=$?
          set -e
          echo "$output"
          if [[ "$code" -ne 1 ]]; then
            echo "Se esperaba el código 1 y llegó $code"
            exit 1
          fi
          if [[ "$output" != *"no respondió"* ]]; then
            echo "Se esperaba el aviso de la URL que no responde"
            exit 1
          fi

  scan:
    name: Escaneo con Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: La fixture cerrada pasa
        uses: ./actions/scan
        with:
          scan-type: config
          scan-ref: tests/fixtures/scan/config/ok
          output: ok.sarif
          upload: "false"

      - name: La fixture abierta falla
        id: broken
        continue-on-error: true
        uses: ./actions/scan
        with:
          scan-type: config
          scan-ref: tests/fixtures/scan/config/broken
          output: broken.sarif
          upload: "false"

      - name: Exigir el código 1 en la fixture abierta
        run: |
          if [[ "${{ steps.broken.outcome }}" != "failure" ]]; then
            echo "Se esperaba el código 1 en config/broken y el paso terminó en '${{ steps.broken.outcome }}'."
            exit 1
          fi

      - name: Comprobar que el fallo viene del umbral
        run: |
          if [[ ! -f broken.sarif ]]; then
            echo "No se generó broken.sarif: el fallo no fue un hallazgo."
            exit 1
          fi
          python3 - <<'PY'
          import json

          try:
              sarif = json.load(open("broken.sarif", encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"No se pudo leer broken.sarif: {error}")

          results = [
              result
              for run in sarif.get("runs", [])
              for result in run.get("results", [])
          ]
          ids = {result.get("ruleId") for result in results}
          if not ids & {"DS002", "AVD-DS-0002"}:
              raise SystemExit(
                  "El SARIF no contiene un resultado DS002: "
                  f"el fallo no fue el umbral esperado (reglas: {sorted(ids)})"
              )
          PY

  container-publish:
    name: Construcción de imagen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Construir la imagen de prueba
        uses: ./actions/container-publish
        with:
          image: selftest
          context: tests/fixtures/image
          push: "false"
          provenance: "false"

  secret-scanning:
    name: Detección de secretos (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos
        uses: ./actions/gitleaks
