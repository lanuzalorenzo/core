name: Compilación y pruebas .NET

on:
  workflow_call:
    inputs:
      solution:
        description: Solución o proyecto que se compila.
        type: string
        required: false
        default: "EcommerceApi.sln"
      dotnet-version:
        description: Versión del SDK de .NET.
        type: string
        required: false
        default: "10.0.x"
      run-format:
        description: Verifica el formato con `dotnet format`.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilación, formato y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restaurar dependencias
        run: dotnet restore "${{ inputs.solution }}"

      - name: Compilar en Release
        run: dotnet build "${{ inputs.solution }}" -c Release --no-restore

      - name: Verificar formato
        if: inputs.run-format
        run: dotnet format "${{ inputs.solution }}" --verify-no-changes --no-restore

      - name: Ejecutar pruebas
        run: >
          dotnet test "${{ inputs.solution }}"
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
