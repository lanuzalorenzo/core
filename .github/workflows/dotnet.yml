name: Compilación y pruebas .NET

on:
  workflow_call:
    inputs:
      solution:
        description: Solución o proyecto que se compila.
        type: string
        required: false
        default: "EcommerceApi.sln"
      dotnet-version:
        description: Versión del SDK de .NET.
        type: string
        required: false
        default: "10.0.x"
      run-format:
        description: Verifica el formato con `dotnet format`.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilación, formato y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
      - name: Compilar y probar
        uses: lanuzalorenzo/core/actions/dotnet@v1.4
        with:
          solution: ${{ inputs.solution }}
          dotnet-version: ${{ inputs.dotnet-version }}
          run-format: ${{ inputs.run-format }}
