name: Construir y publicar una imagen
description: Construye una imagen con Buildx, la publica en el registro indicado o la deja en el daemon local con `load`, y adjunta procedencia al publicar.
inputs:
  image:
    description: Nombre de la imagen dentro del registro, sin el registro delante.
    required: true
  registry:
    description: Registro donde se publica.
    required: false
    default: ghcr.io
  context:
    description: Directorio de contexto de la construcción.
    required: false
    default: "."
  dockerfile:
    description: Ruta del Dockerfile, relativa al contexto.
    required: false
    default: Dockerfile
  push:
    description: Publica la imagen. En `false` solo construye.
    required: false
    default: "true"
  load:
    description: Carga la imagen en el daemon local con la etiqueta del `ref`. Solo vale con `push` en `false` y una sola plataforma; no se puede publicar y cargar a la vez.
    required: false
    default: "false"
  provenance:
    description: Modo de procedencia de Buildx. `false` la desactiva.
    required: false
    default: mode=max
  platforms:
    description: Plataformas separadas por comas.
    required: false
    default: linux/amd64
  build-args:
    description: Argumentos de construcción, uno por línea.
    required: false
    default: ""
  secrets:
    description: Secretos de BuildKit, con formato `id=valor`, uno por línea.
    required: false
    default: ""
  cache-from:
    description: Origen de caché de Buildx.
    required: false
    default: ""
  cache-to:
    description: Destino de caché de Buildx.
    required: false
    default: ""
  username:
    description: Usuario del registro. Sin usuario ni contraseña no se inicia sesión.
    required: false
    default: ""
  password:
    description: Contraseña o token del registro.
    required: false
    default: ""
outputs:
  digest:
    description: Digest de la imagen publicada.
    value: ${{ steps.build.outputs.digest }}
  tag:
    description: Etiqueta de la imagen con el `ref` de la ejecución; con `load` en `true` es la que queda en el daemon local.
    value: ${{ steps.metadata.outputs.tag }}
runs:
  using: composite
  steps:
    - name: Preparar Buildx
      uses: docker/setup-buildx-action@v3

    - name: Iniciar sesión en el registro
      if: inputs.username != '' && inputs.password != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Calcular etiquetas y metadatos
      id: metadata
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        PUSH: ${{ inputs.push }}
        LOAD: ${{ inputs.load }}
        PLATFORMS: ${{ inputs.platforms }}
        PROVENANCE: ${{ inputs.provenance }}
      run: |
        if [ "$PUSH" = "true" ] && [ "$LOAD" = "true" ]; then
          echo "::error::load y push no se combinan: una imagen no se publica y se carga a la vez."
          exit 1
        fi
        if [ "$LOAD" = "true" ] && [ "${PLATFORMS}" != "${PLATFORMS%%,*}" ]; then
          echo "::error::load exige una sola plataforma; ${PLATFORMS} no se puede cargar en el daemon local."
          exit 1
        fi
        ref="${GITHUB_REF_NAME//\//-}"
        short="$(git rev-parse --short HEAD)"
        file="${DOCKERFILE:-Dockerfile}"
        case "$file" in
          /*) ;;
          *) file="${CONTEXT%/}/$file" ;;
        esac
        provenance="$PROVENANCE"
        if [ "$PUSH" != "true" ]; then
          provenance="false"
        fi
        tag="${REGISTRY}/${IMAGE}:${ref}"
        {
          echo "tags<<EOF"
          echo "$tag"
          echo "${REGISTRY}/${IMAGE}:sha-${short}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        {
          echo "labels<<EOF"
          echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          echo "org.opencontainers.image.revision=${GITHUB_SHA}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "file=${file}" >> "$GITHUB_OUTPUT"
        echo "provenance=${provenance}" >> "$GITHUB_OUTPUT"

    - name: Construir y publicar
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ steps.metadata.outputs.file }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.secrets }}
        provenance: ${{ steps.metadata.outputs.provenance }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
