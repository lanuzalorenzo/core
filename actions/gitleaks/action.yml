name: Escanear secretos con Gitleaks
description: Escanea el historial completo del repositorio con Gitleaks y falla si encuentra una credencial.
runs:
  using: composite
  steps:
    - name: Comprobar que el clon trae todo el historial
      shell: bash
      run: |
        if [[ "$(git rev-parse --is-shallow-repository 2>/dev/null)" == "true" ]]; then
          echo "::error::El clon es superficial y el escaneo no cubriría el historial. Usa fetch-depth: 0 en el checkout."
          exit 1
        fi

    - name: Instalar Gitleaks
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz -C "$HOME/.local/bin" gitleaks

    - name: Escanear secretos
      shell: bash
      run: '"$HOME/.local/bin/gitleaks" detect --source . --redact --verbose --exit-code 2'
