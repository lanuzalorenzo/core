name: Baseline de sshd sobre musl
description: Falla si un Dockerfile instala sshd sobre una base musl y deja abierta la autenticación por contraseña.
inputs:
  root:
    description: Directorio o Dockerfile que se revisa, relativo al workspace.
    required: false
    default: "."
  skip:
    description: Directorios a omitir, separados por comas.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Revisar Dockerfiles
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_SKIP: ${{ inputs.skip }}
      run: |
        args=("$INPUT_ROOT")
        IFS=',' read -ra dirs <<< "$INPUT_SKIP"
        for dir in "${dirs[@]}"; do
          dir="${dir#"${dir%%[![:space:]]*}"}"
          dir="${dir%"${dir##*[![:space:]]}"}"
          [[ -n "$dir" ]] && args+=(--skip "$dir")
        done
        python3 "${{ github.action_path }}/check_sshd_baseline.py" "${args[@]}"
