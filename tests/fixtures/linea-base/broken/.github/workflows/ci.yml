name: Integración continua

on:
  push:
    branches: [main]

permissions: write-all

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Publicar
        run: echo "${{ secrets.TOKEN }}"
        env:
          TOKEN: valor-de-ejemplo
