name: Enlaces y secretos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos
        uses: lanuzalorenzo/core/actions/gitleaks@v1.4

      - name: Comprobar enlaces
        uses: lanuzalorenzo/core/actions/check-links@v1.4
